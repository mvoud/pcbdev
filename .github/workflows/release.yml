name: Build and Release pcbdev

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: pcbdev-linux
          - os: macos-latest
            artifact_name: pcbdev-macos
          - os: windows-latest
            artifact_name: pcbdev-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup environment
        run: python command.py --init

      - name: Compile with PyInstaller
        run: python command.py --compile

      - name: Verify build output
        shell: bash
        run: ls -la dist/

      # ---------- LINUX ----------
      - name: Package Linux (.tar.gz + .deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          mkdir -p release

          # 1. Tar.gz portatile
          mkdir -p pcbdev-linux/usr/local/bin
          cp dist/pcbdev pcbdev-linux/usr/local/bin/pcbdev
          chmod +x pcbdev-linux/usr/local/bin/pcbdev
          cat > pcbdev-linux/README.txt << 'EOF'
          PCBDEV - Generate KiCad libraries from JSON

          Installazione:
            1. Copia il binario nel PATH:
               sudo cp usr/local/bin/pcbdev /usr/local/bin/
            2. Rendilo eseguibile:
               sudo chmod +x /usr/local/bin/pcbdev
            3. Provalo:
               pcbdev --help
          EOF
          tar czf release/pcbdev-linux.tar.gz -C pcbdev-linux .

          # 2. Pacchetto .deb
          mkdir -p deb/DEBIAN deb/usr/bin
          cp dist/pcbdev deb/usr/bin/pcbdev
          chmod +x deb/usr/bin/pcbdev
          cat > deb/DEBIAN/control << 'EOF'
          Package: pcbdev
          Version: 1.0.0
          Section: electronics
          Priority: optional
          Architecture: amd64
          Maintainer: mvoud <mvoud@example.com>
          Description: Generate KiCad libraries from JSON
           pcbdev is a CLI tool that generates KiCad symbols and footprints
           from a simple JSON-based layout description.
          EOF
          dpkg-deb --build deb release/pcbdev-linux.deb

          # 3. Binario raw
          cp dist/pcbdev release/pcbdev-linux

          ls -la release/

      # ---------- MACOS ----------
      - name: Package macOS (.pkg + raw)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          mkdir -p release

          # 1. Pacchetto .pkg (installer nativo)
          mkdir -p packaging/root/usr/local/bin
          cp dist/pcbdev packaging/root/usr/local/bin/pcbdev
          chmod +x packaging/root/usr/local/bin/pcbdev
          pkgbuild --root packaging/root \
                   --identifier com.mvoud.pcbdev \
                   --version 1.0.0 \
                   --install-location / \
                   release/pcbdev-macos.pkg

          # 2. Binario raw
          cp dist/pcbdev release/pcbdev-macos

          ls -la release/

      # ---------- WINDOWS ----------
      - name: Package Windows (.zip + raw)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          # 1. ZIP con dentro l'eseguibile e un README
          New-Item -ItemType Directory -Force -Path pcbdev-windows | Out-Null
          Copy-Item dist\pcbdev.exe pcbdev-windows\pcbdev.exe
          @"
          PCBDEV - Generate KiCad libraries from JSON

          Installazione:
            1. Estrai pcbdev.exe in una cartella a piacere
               (es. C:\Program Files\PCBDEV\)
            2. Aggiungi quella cartella al PATH di sistema
            3. Provalo:
               pcbdev --help
          "@ | Out-File -Encoding UTF8 pcbdev-windows\README.txt
          Compress-Archive -Path pcbdev-windows\* -DestinationPath release\pcbdev-windows.zip -Force

          # 2. Binario raw
          Copy-Item dist\pcbdev.exe release\pcbdev-windows.exe

          Get-ChildItem release\

      # ---------- UPLOAD ----------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List files
        run: ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
          overwrite_files: true