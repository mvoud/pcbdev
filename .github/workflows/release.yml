name: Build and Release pcbdev

# Il workflow si attiva quando invii un tag che inizia con "v" (es. v1.0.0)
on:
  push:
    tags:
      - 'v*'

# Permessi necessari per creare la Release e allegare i file
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Puoi usare la versione che preferisci

      - name: Prepara l'ambiente
        run: python command.py --init

      - name: Compila l'eseguibile
        run: python command.py --compile

      - name: Carica l'artefatto (temporaneo)
        uses: actions/upload-artifact@v4
        with:
          name: pcbdev-${{ matrix.os }}
          path: dist/*

  release:
    needs: build # Aspetta che tutte le build finiscano con successo
    runs-on: ubuntu-latest
    steps:
      - name: Scarica tutti gli artefatti
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pubblica la Release
        uses: softprops/action-gh-release@v2
        with:
          # Allegherà tutti i file trovati nelle cartelle degli artefatti
          files: artifacts/**/*
          generate_release_notes: true