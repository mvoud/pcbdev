name: Build and Release pcbdev

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: pcbdev-linux
          - os: macos-latest
            artifact_name: pcbdev-macos
          - os: windows-latest
            artifact_name: pcbdev-windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepara l'ambiente
        run: python command.py --init

      - name: Compila l'eseguibile
        run: python command.py --compile

      - name: Rinomina il binario in modo univoco
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/pcbdev.exe "release/${{ matrix.artifact_name }}.exe"
          else
            cp dist/pcbdev "release/${{ matrix.artifact_name }}"
            chmod +x "release/${{ matrix.artifact_name }}"
          fi
          ls -la release/

      - name: Carica l'artefatto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Scarica tutti gli artefatti
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Lista file da pubblicare
        run: ls -la release/

      - name: Pubblica la Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false