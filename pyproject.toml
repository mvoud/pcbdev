[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbdev"
version = "0.1.0"
description = "Generatore di librerie KiCad per schede di sviluppo"
requires-python = ">=3.9"
dependencies = [
    "KicadModTree",
    "PyYAML",
    "future",
]

[project.scripts]
pcbdev = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]